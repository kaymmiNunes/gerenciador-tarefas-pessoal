<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de Login</title>
  <link rel="stylesheet" href="./css/login.css">
</head>

<body class="pagina-acesso">

  <main class="container-acesso">
    <img src="./img/img-cadente.png" alt="Logo" class="logo-acesso">

    <h1>Login</h1>

    <form id="formLogin">
      <div class="input-box">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          placeholder="Digite seu e-mail"
          required
        >
      </div>

      <div class="input-box">
        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          placeholder="Digite sua senha"
          required
        >
      </div>

      <p class="forgot">
        <a href="senha.html">Esqueceu a senha?</a>
      </p>

      <button type="submit">Entrar</button>
      <button type="button" id="botaoVisitante" class="botao-visitante">
  Entrar como visitante
</button>
      <p id="mensagemLogin"></p>

      <p class="register">
        Não tem conta?
        <a href="cadastro.html">Cadastre-se</a>
      </p>
    </form>
  </main>
<script type="module" src="./js/login.js"></script>
</body>
</html>
