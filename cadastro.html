<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#141e30,#243b55);
    }

    .container{
      background:#fff;
      width:350px;
      padding:40px;
      border-radius:15px;
      box-shadow:0 0 20px rgba(0,0,0,0.3);
    }

    .container h1{
      text-align:center;
      margin-bottom:30px;
      color:#243b55;
    }

    .input-box{
      margin-bottom:15px;
    }

    .input-box label{
      display:block;
      margin-bottom:8px;
      color:#333;
      font-weight:bold;
    }

    .input-box input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
      transition:0.3s;
    }

    .input-box input:focus{
      border-color:#243b55;
      box-shadow:0 0 5px rgba(36,59,85,0.5);
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#243b55;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
      margin-top:10px;
    }

    button:hover{
      background:#141e30;
    }

    .login-link{
      text-align:center;
      margin-top:20px;
      font-size:14px;
    }

    .login-link a{
      text-decoration:none;
      color:#243b55;
      font-weight:bold;
    }

    .login-link a:hover{
      text-decoration:underline;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Cadastro</h1>

    <form>

      <div class="input-box">
        <label>Nome</label>
        <input type="text" placeholder="Digite seu nome" required>
      </div>

      <div class="input-box">
        <label>E-mail</label>
        <input type="email" placeholder="Digite seu e-mail" required>
      </div>

      <div class="input-box">
        <label>Senha</label>
        <input type="password" placeholder="Crie uma senha" required>
      </div>

      <button type="submit">Cadastrar</button>

      <div class="login-link">
        Já tem conta?
        <a href="login.html">Entrar</a>
      </div>

    </form>

  </div>

</body>
</html>
