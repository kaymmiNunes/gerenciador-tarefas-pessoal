<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="./css/login.css">
</head>

<body class="pagina-acesso">

  <main class="container-acesso">
    <img src="./img/img-cadente.png" alt="Logo" class="logo-acesso">

    <h1>Crie sua conta</h1>

    <form id="formCadastro">
      <div class="input-box">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required>
      </div>

      <div class="input-box">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" required>
      </div>

      <div class="input-box">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Crie uma senha" required>
      </div>

      <div class="input-box">
        <label for="confirmar-senha">Confirmar senha</label>
        <input
          type="password"
          id="confirmar-senha"
          placeholder="Digite a senha novamente"
          required
        >
      </div>

      <button type="submit">Cadastrar</button>
      <p id="mensagemCadastro"></p>
      <p class="register">
        Já possui uma conta?
        <a href="login.html">Entrar</a>
      </p>
    </form>
  </main>
<script type="module" src="./js/cadastro.js"></script>
</body>
</html>
