<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#141e30,#243b55);
    }

    .container{
      background:#fff;
      width:350px;
      padding:40px;
      border-radius:15px;
      box-shadow:0 0 20px rgba(0,0,0,0.3);
    }

    h1{
      text-align:center;
      margin-bottom:20px;
      color:#243b55;
    }

    p{
      text-align:center;
      font-size:14px;
      margin-bottom:20px;
      color:#555;
    }

    input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
      margin-bottom:15px;
    }

    input:focus{
      border-color:#243b55;
      box-shadow:0 0 5px rgba(36,59,85,0.5);
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#243b55;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#141e30;
    }

    .back{
      text-align:center;
      margin-top:15px;
      font-size:14px;
    }

    .back a{
      text-decoration:none;
      color:#243b55;
      font-weight:bold;
    }

    .back a:hover{
      text-decoration:underline;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Recuperar Senha</h1>

    <p>Digite seu e-mail para receber instruções de recuperação.</p>

    <form>
      <input type="email" placeholder="Seu e-mail" required>
      <button type="submit">Enviar</button>
    </form>

    <div class="back">
      <a href="login.html">Voltar para o login</a>
    </div>

  </div>

</body>
</html>
