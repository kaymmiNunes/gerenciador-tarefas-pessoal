<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha</title>
  <link rel="stylesheet" href="./css/login.css">
</head>

<body class="pagina-acesso">

  <main class="container-acesso">
    <img src="img/logo.png" alt="Logo" class="logo-acesso">

    <h1>Recuperar senha</h1>

    <p>Digite seu e-mail para receber instruções de recuperação.</p>

    <form id="formRecuperarSenha">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="Seu e-mail" required>

      <button type="submit">Enviar</button>
      <p id="mensagemSenha"></p>
    </form>

    <p class="voltar-login">
      <a href="login.html">Voltar para o login</a>
    </p>
  </main>
<script type="module" src="./js/senha.js"></script>
</body>
</html>
